
services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/dist:/usr/share/nginx/html
    depends_on:
      - app
    networks:
      - ginchat-network
    restart: unless-stopped
  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    environment:
        #TODO 你的角色:你的数据库密码，这里出于隐私安全，我不会暴露我的密码
      - MYSQL_DSN=root:your_mysql_password@tcp(Mysql:3306)/go_chat?charset=utf8mb4&parseTime=True&loc=Local
      - REDIS_ADDR=redis:6379
      - KAFKA_BROKER=kafka:9092
    volumes:
        #TODO 目前用户上传的图片会存储在后端项目static文件夹中，后续扩展可考虑MinIO 对象存储
      - ./static/upload:/root/static/upload
    networks:
      - ginchat-network
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      #TODO 输入数据库密码，注意这里数据库角色默认是root
      MYSQL_ROOT_PASSWORD: your_mysql_password
      MYSQL_DATABASE: go_chat

    volumes:
      - mysql-data:/var/lib/mysql
      - ./initSql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - ginchat-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine

    volumes:
      - redis-data:/data
    networks:
      - ginchat-network
    command: redis-server --appendonly yes
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.0.0
    environment:
      # KRaft 单节点 combined 模式（broker + controller 合一）
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      # app 容器通过 Docker 网络以主机名 kafka:9092 访问
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # 数据真正落到 volume，容器重建不丢
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # 单节点必须全部为 1，否则内部 topic 建不起来
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - ginchat-network
    restart: unless-stopped
volumes:
  mysql-data:
  redis-data:
  kafka-data:

networks:
  ginchat-network:
    driver: bridge
